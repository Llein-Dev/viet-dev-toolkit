name: CI / Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test vn-cccd-parser
        run: |
          cd packages/vn-cccd-parser
          npm install
          npm test
          npm run build

      - name: Test vn-bank-qr-gen
        run: |
          cd packages/vn-bank-qr-gen
          npm install
          npm test
          npm run build

      - name: Test vn-currency-words
        run: |
          cd packages/vn-currency-words
          npm install
          npm test
          npm run build

      - name: Test vn-plate-format
        run: |
          cd packages/vn-plate-format
          npm install
          npm test
          npm run build

      - name: Test anpr-plate-cleaner
        run: |
          cd packages/anpr-plate-cleaner
          npm install
          npm test
          npm run build

      - name: Test vn-tax-id-validator
        run: |
          cd packages/vn-tax-id-validator
          npm install
          npm test
          npm run build

      - name: Test vn-phone-carrier
        run: |
          cd packages/vn-phone-carrier
          npm install
          npm test
          npm run build
